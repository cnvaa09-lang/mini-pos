<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini POS - Kasir Digital</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
  --cream:#f8f5f1;
  --purple:#8877bd;
  --lavender:#eee9fb;
  --mint:#e4f2e9;
  --pink:#f8e6e8;
  --text:#393b42;
}
body {
  background:var(--cream);
  color:var(--text);
  font-family:Arial,sans-serif;
}
.navbar {
  background:white;
  padding:18px;
}
.brand {
  color:var(--purple);
  font-size:24px;
  font-weight:bold;
}
.card {
  border:0;
  border-radius:18px;
  box-shadow:0 5px 20px #0000000b;
}
.metric {
  padding:22px;
  border-radius:18px;
}
.metric:nth-child(1) .metric-box {background:var(--lavender)}
.metric:nth-child(2) .metric-box {background:var(--mint)}
.metric:nth-child(3) .metric-box {background:var(--pink)}
.metric-box {
  padding:20px;
  border-radius:16px;
}
.metric h3 {
  font-weight:bold;
}
.product-card {
  overflow:hidden;
  transition:.2s;
}
.product-card:hover {
  transform:translateY(-4px);
}
.product-card img {
  width:100%;
  height:145px;
  object-fit:cover;
}
.product-card .card-body {
  padding:13px;
}
.price {
  color:var(--purple);
  font-weight:bold;
}
.btn-add {
  background:var(--lavender);
  color:#665492;
  border:0;
  border-radius:10px;
  font-weight:bold;
}
.btn-add:hover {
  background:var(--purple);
  color:white;
}
.btn-checkout {
  background:var(--purple);
  color:white;
  border:0;
  padding:13px;
  border-radius:12px;
  width:100%;
  font-weight:bold;
}
.btn-checkout:hover {
  background:#70609f;
  color:white;
}
.payment-btn {
  border:1px solid #ddd;
  background:white;
  border-radius:10px;
  padding:10px 4px;
  font-size:13px;
}
.payment-btn.active {
  background:var(--lavender);
  border-color:var(--purple);
  color:#665492;
  font-weight:bold;
}
.stock-safe {color:green;font-size:12px}
.stock-low {color:#d18a28;font-size:12px}
.stock-out {color:red;font-size:12px}
.cart-item {
  border-bottom:1px solid #eee;
  padding:12px 0;
}
.cart-item img {
  width:55px;
  height:55px;
  object-fit:cover;
  border-radius:10px;
}
.form-control,.form-select {
  border-radius:10px;
  padding:11px;
}
@media(max-width:576px) {
  .product-card img {height:115px}
}
@media print {
  body * {visibility:hidden}
  #receipt,#receipt * {visibility:visible}
  #receipt {
    position:absolute;
    left:0;
    top:0;
    width:100%;
    padding:15px;
  }
}
</style>
</head>

<body>

<nav class="navbar shadow-sm mb-4">
<div class="container">
  <div>
    <div class="brand">🧾 MINI POS</div>
    <small>Kasir Digital Kantin & Warung</small>
  </div>
  <span id="today"></span>
</div>
</nav>

<div class="container pb-5">

<!-- RINGKASAN -->
<div class="row g-3 mb-4">

<div class="col-md-4 metric">
<div class="metric-box">
  <p>💰 Omzet Hari Ini</p>
  <h3 id="revenue">Rp0</h3>
</div>
</div>

<div class="col-md-4 metric">
<div class="metric-box">
  <p>📦 Total Sisa Stok</p>
  <h3 id="totalStock">0</h3>
</div>
</div>

<div class="col-md-4 metric">
<div class="metric-box">
  <p>🛍️ Transaksi Hari Ini</p>
  <h3 id="transactionCount">0</h3>
</div>
</div>

</div>

<div class="row g-4">

<!-- DAFTAR PRODUK -->
<div class="col-lg-8">

<div class="card p-3">

<h4 class="mb-3">🍜 Daftar Menu</h4>

<input
type="text"
id="search"
class="form-control mb-3"
placeholder="Cari makanan atau minuman..."
>

<div class="mb-3">
<button class="btn btn-sm btn-outline-secondary" onclick="filterCategory('Semua')">Semua</button>
<button class="btn btn-sm btn-outline-secondary" onclick="filterCategory('Makanan')">Makanan</button>
<button class="btn btn-sm btn-outline-secondary" onclick="filterCategory('Minuman')">Minuman</button>
</div>

<div class="row g-3" id="products"></div>

</div>
</div>

<!-- KERANJANG -->
<div class="col-lg-4">

<div class="card p-3">

<h4>🛒 Keranjang</h4>

<div id="cartList"></div>

<hr>

<div class="d-flex justify-content-between">
<span>Subtotal</span>
<strong id="subtotal">Rp0</strong>
</div>

<div class="d-flex justify-content-between mt-2">
<strong>Total</strong>
<strong id="total">Rp0</strong>
</div>

<hr>

<h6>Metode Pembayaran</h6>

<div class="row g-2">

<div class="col-4">
<button class="payment-btn active w-100" onclick="setPayment('Tunai',this)">💵 Tunai</button>
</div>

<div class="col-4">
<button class="payment-btn w-100" onclick="setPayment('QRIS',this)">▦ QRIS</button>
</div>

<div class="col-4">
<button class="payment-btn w-100" onclick="setPayment('Transfer Bank',this)">🏦 Bank</button>
</div>

</div>

<div id="cashWrap" class="mt-3">
<label class="form-label">Uang Diterima</label>
<input type="number" id="cash" class="form-control" placeholder="Masukkan uang">
<div id="change" class="mt-2 small"></div>
</div>

<button class="btn-checkout mt-3" id="checkout" onclick="checkout()" disabled>
PROSES PEMBAYARAN
</button>

<button class="btn btn-outline-danger w-100 mt-2" onclick="clearCart()">
Kosongkan Keranjang
</button>

</div>
</div>
</div>

<!-- TAMBAH PRODUK -->
<div class="card p-4 mt-4">

<h4>⚙️ Kelola Produk</h4>
<p class="text-secondary">Tambahkan makanan dan minuman baru.</p>

<form id="productForm">

<div class="row g-3">

<div class="col-md-3">
<label>Nama Produk</label>
<input id="newName" class="form-control" required>
</div>

<div class="col-md-2">
<label>Kategori</label>
<select id="newCategory" class="form-select">
<option>Makanan</option>
<option>Minuman</option>
</select>
</div>

<div class="col-md-2">
<label>Harga</label>
<input id="newPrice" type="number" class="form-control" min="1" required>
</div>

<div class="col-md-2">
<label>Stok</label>
<input id="newStock" type="number" class="form-control" min="0" required>
</div>

<div class="col-md-3">
<label>URL Gambar</label>
<input id="newImage" type="url" class="form-control" placeholder="https://...">
</div>

<div class="col-12">
<button class="btn btn-success w-100" type="submit">
+ Tambahkan Produk
</button>
</div>

</div>
</form>
</div>

<div id="receipt"></div>

</div>

<script src="app.js"></script>
</body>
</html>
